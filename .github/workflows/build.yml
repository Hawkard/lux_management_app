name: Build release

# Builds the Windows and Mac downloads (there is no Linux version) on one of GitHub's Macs.
# Runs when a version tag like v2.9.0 is pushed, or a release with a new tag is published
# on GitHub, and puts the files on that release (creating it if needed). Can also be
# started by hand from the Actions tab: to test a build (the files then stay with the run,
# and the Windows app is also opened on one of GitHub's Windows computers), or, with
# "Publish the release" ticked, to publish the release v<version> itself.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<version> (from main only; makes the tag too)
        type: boolean
        default: false

permissions:
  contents: write

# Publishing a release on GitHub also pushes its tag, which starts this twice.
# The newer run replaces the older one, so the files are only uploaded once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the Neutralino CLI
        run: npm install -g @neutralinojs/neu@11.7.2

      - name: Build
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          LUX_REQUIRE_MAC: '1'
        run: python3 scripts/build.py

      # Opens the Mac app from the disk image and waits for Lux to start, so a Mac app
      # that doesn't open is never published. It starts with a window kept bigger than the
      # screen and Neutralino's old saved spot far off the screen (what made the window
      # disappear up to 2.9.0), and the window must open inside the screen.
      - name: Check that the Mac app opens, with its window on the screen
        run: |
          hdiutil attach dist/Lux-Management-Mac-*.dmg -nobrowse -mountpoint /tmp/luxcheck
          cp -R "/tmp/luxcheck/Lux Management.app" "$RUNNER_TEMP/"
          hdiutil detach /tmp/luxcheck
          codesign --verify --strict "$RUNNER_TEMP/Lux Management.app"
          H="$HOME/Library/Application Support/Lux Management"
          mkdir -p "$H/config" "$H/data/people" "$H/.tmp"
          echo '{"userId":"u_check","window":{"width":5000,"height":4000,"maximized":false}}' > "$H/config/settings.json"
          echo '{"name":"Check","createdAt":1}' > "$H/data/people/u_check.json"
          echo '{"x":6000,"y":4000,"width":1320,"height":860,"maximize":false,"minWidth":480,"minHeight":560,"maxWidth":-1,"maxHeight":-1,"resizable":true}' > "$H/.tmp/window_state.config.json"
          open "$RUNNER_TEMP/Lux Management.app"
          for i in $(seq 1 45); do [ -f "$H/versions/index.json" ] && break; sleep 2; done
          test -f "$H/versions/index.json" || { pkill -x LuxManagement || true; echo "The Mac app did not open."; exit 1; }
          echo "The Mac app opened."
          sleep 3
          swift scripts/check-window.swift || { pkill -x LuxManagement || true; echo "The Lux window is not on the screen."; exit 1; }
          pkill -x LuxManagement || true
          test ! -f "$H/.tmp/window_state.config.json" || { echo "Neutralino's old window file was not removed."; exit 1; }

      # Optional. Only runs if you add a repository secret named LUX_SIGNING_KEY
      # (Settings > Secrets and variables > Actions). Lux then installs the update straight
      # from this release. Without it, publish the .neu from Lux (Settings > Program updates >
      # Publish an update) or sign it on your computer and add the .luxupdate to the release.
      - name: Sign the update (only if a signing key secret exists)
        env:
          LUX_SIGNING_KEY: ${{ secrets.LUX_SIGNING_KEY }}
        run: |
          if [ -n "$LUX_SIGNING_KEY" ]; then
            node scripts/sign-update.mjs dist/Lux-Management-*.neu
            (cd dist && shasum -a 256 lux-update-*.luxupdate >> SHA256SUMS.txt)
          else
            echo "No LUX_SIGNING_KEY secret, so no .luxupdate was made. Lux can't install this release from GitHub by itself."
          fi

      - name: Keep the files with this run
        uses: actions/upload-artifact@v6
        with:
          name: lux-management-build
          path: dist/

      - name: Put the files on the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            # A release published on GitHub with an empty description gets the changelog notes.
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
              gh release edit "$TAG" --notes-file .tmp/release-notes.md
            fi
          else
            gh release create "$TAG" dist/* --verify-tag --title "Lux Management ${TAG#v}" --notes-file .tmp/release-notes.md
          fi

      # Started by hand with "Publish the release" ticked: publishes v<version> (the version in
      # src/lux-management.html) with these files, tagging the commit this run built. A release made
      # this way doesn't start the build again.
      - name: Publish the release (started by hand with "Publish the release" ticked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Releases are published from main only. Start this from main."
            exit 1
          fi
          if ! ls dist/lux-update-*.luxupdate > /dev/null 2>&1; then
            echo "No signed update (.luxupdate) was made, so no Lux could install this release by itself. Add the LUX_SIGNING_KEY secret, then run this again."
            exit 1
          fi
          VERSION=$(python3 -c "import re; print(re.search(r\"const APP_VERSION = '([0-9.]+)'\", open('src/lux-management.html', encoding='utf-8').read()).group(1))")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "There is already a release $TAG. Raise the version, or delete that release first."
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Lux Management $VERSION" --notes-file .tmp/release-notes.md

  # Test builds only (started by hand without "Publish the release"): opens the Windows app on
  # one of GitHub's Windows computers and checks that its window opens on the screen.
  windows-check:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: lux-management-build
          path: dist

      - name: Check that the Windows app opens, with its window on the screen
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter 'Lux-Management-Windows-*.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\lux"
          ./scripts/check-window.ps1 "$env:RUNNER_TEMP\lux\Lux Management"
